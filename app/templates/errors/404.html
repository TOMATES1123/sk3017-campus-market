{% extends "base.html" %}
{% block title %}页面不存在 · 校园集市{% endblock %}
{% block content %}
<div class="container">
    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="h4 mt-3">页面或商品不存在</h1>
        <p class="text-muted">它可能已经被删除、下架，或者链接输错了。</p>
        <div class="d-flex gap-2 justify-content-center">
            <a class="btn btn-brand" href="{{ url_for('market.index') }}">去市场看看</a>
            <a class="btn btn-ghost" href="{{ url_for('market.index') }}?q=">搜索其他商品</a>
        </div>
    </div>
</div>
{% endblock %}
