{% extends "base.html" %}
{% block title %}上传内容过大 · 校园集市{% endblock %}
{% block content %}
<div class="container">
    <div class="error-page">
        <div class="error-code">413</div>
        <h1 class="h4 mt-3">上传的内容太大了</h1>
        <p class="text-muted">单次请求不能超过 12MB，单张商品图不能超过 2MB。请压缩图片后重试。</p>
        <a class="btn btn-brand" href="{{ url_for('market.create_item') }}">重新发布</a>
    </div>
</div>
{% endblock %}
