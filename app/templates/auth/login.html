{% extends "base.html" %}

{% block title %}登录 · 校园集市{% endblock %}

{% block content %}
<div class="container" style="max-width: 960px">
    <div class="row g-4 align-items-stretch mt-2">
        <div class="col-lg-5 d-none d-lg-block">
            <div class="auth-side h-100">
                <span class="hero-eyebrow">Welcome back</span>
                <h2 class="mt-3">把闲置<br>交给下一位同学</h2>
                <p>登录后可发布商品、收藏心仪的闲置、和卖家留言沟通。</p>
                <ul class="auth-points">
                    <li>同校当面交易，省心省运费</li>
                    <li>分类 + 搜索，找东西更快</li>
                    <li>留言板直接问，沟通不绕弯</li>
                </ul>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="panel h-100">
                <h1 class="panel-title">登录账号</h1>
                <p class="panel-sub">还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></p>

                <form method="post" action="{{ url_for('auth.login') }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="next" value="{{ next_url }}">

                    <div class="mb-3">
                        <label class="form-label" for="account">用户名或邮箱</label>
                        <input class="form-control" id="account" name="account" required autofocus
                               value="{{ account }}" placeholder="例如：xiaoming">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">密码</label>
                        <input class="form-control" id="password" name="password" type="password"
                               required placeholder="请输入密码">
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label small" for="remember">记住我</label>
                        </div>
                        <span class="small text-muted">演示账号：xiaoming / 123456</span>
                    </div>
                    <button class="btn btn-brand w-100 py-2" type="submit">登录</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
